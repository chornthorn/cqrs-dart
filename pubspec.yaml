name: dart_cqrs_workspace
publish_to: none
description: Monorepo workspace for dart_cqrs packages and examples.

environment:
  sdk: ^3.12.0

workspace:
  - packages/dart_cqrs
  - examples/hello_world

melos:
  scripts:
    analyze:
      exec: dart analyze .
      description: Run `dart analyze` across all packages.
    test:
      exec: dart test
      description: Run `dart test` across all packages.
    build:
      exec: dart run build_runner build
      packageFilters:
        dependsOn: build_runner
      description: Run `build_runner build` in packages that depend on build_runner.
    format:
      run: dart format --output=none --set-exit-if-changed .
      description: Check code formatting.

dev_dependencies:
  lints: ^6.0.0
  melos: ^8.3.0
